[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arm"
version = "0.0.1"
description = "Starter package for attention-based exemplar simulations."
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "pandas", "torch"]  # add what you use

[tool.setuptools.packages.find]
where = ["."]
include = ["arm*"]
